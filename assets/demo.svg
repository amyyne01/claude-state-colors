<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" role="img" aria-label="Animated demo: the state band cycles ready, thinking, running with a live subagent trace, then done"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}.t{opacity:0;animation:cyc 12s linear infinite}@keyframes cyc{0%{opacity:0}1%{opacity:1}24%{opacity:1}25%{opacity:0}100%{opacity:0}}.t0{animation-delay:0s}.t1{animation-delay:3s}.t2{animation-delay:6s}.t3{animation-delay:9s}@media (prefers-reduced-motion:reduce){.t{animation:none;opacity:0}.t2{opacity:1}}</style><rect width="720" height="240" rx="10" fill="#0d1117"/><circle cx="20" cy="18" r="5" fill="#f85149"/><circle cx="38" cy="18" r="5" fill="#e3b341"/><circle cx="56" cy="18" r="5" fill="#3fb950"/><text x="80" y="22" fill="#7d8590" font-size="12">state-colors - the band above your prompt</text><g class="t t0"><rect x="24" y="46" width="74" height="20" rx="3" fill="#3fb950"/><text x="31" y="60" fill="#0d1117" font-weight="700">● READY</text></g><g class="t t1"><rect x="24" y="46" width="100" height="20" rx="3" fill="#d2a8ff"/><text x="31" y="60" fill="#0d1117" font-weight="700">◆ THINKING</text><text x="134.0" y="60" fill="#7d8590" >0s  0 tools</text></g><g class="t t2"><rect x="24" y="46" width="91" height="20" rx="3" fill="#39c5cf"/><text x="31" y="60" fill="#0d1117" font-weight="700">▶ RUNNING</text><text x="125.39999999999999" y="60" fill="#39c5cf" >Bash</text><text x="173.79999999999998" y="60" fill="#7d8590" >6s  3 tools</text><text x="24" y="92" fill="#d2a8ff" font-weight="700">⚑ AGENTS </text><text x="104" y="92" fill="#d2a8ff" opacity=".6">2 running</text><text x="24" y="114" fill="#d2a8ff" opacity=".6">├</text><rect x="44" y="100" width="72" height="19" rx="3" fill="#d2a8ff"/><text x="50" y="114" fill="#0d1117" >running</text><text x="124.19999999999999" y="114" fill="#e6edf3" font-weight="700">Fix baseline #1</text><text x="267.2" y="114" fill="#7d85